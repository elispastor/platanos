<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Máster - Plátanos El Pulpo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-oscuro: #0f2e14; --verde-medio: #1f5c2c; --amarillo: #ffcc00;
            --blanco: #ffffff; --gris-fondo: #f4f7f6; --texto: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--gris-fondo); color: var(--texto); padding: 20px; }
        .master-container { max-width: 500px; margin: 0 auto; background: var(--blanco); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .master-header { background: var(--verde-oscuro); color: var(--blanco); padding: 20px; text-align: center; }
        .master-header h1 { font-size: 1.5rem; font-weight: 900; color: var(--amarillo); }
        .master-header p { font-size: 0.9rem; color: #d1e7d3; }
        .master-body { padding: 30px 20px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px 45px 15px 15px; border: 2px solid #ccc; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 1rem; transition: 0.3s; }
        .input-group input:focus { border-color: var(--verde-medio); outline: none; }
        .btn-mic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--verde-medio); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .btn-mic.escuchando { background: #e74c3c; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.1); } 100% { transform: translateY(-50%) scale(1); } }
        .btn-principal { width: 100%; padding: 18px; background: var(--verde-medio); color: var(--blanco); border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 5px 15px rgba(31, 92, 44, 0.3); transition: 0.2s; }
        .btn-principal:hover { background: var(--verde-oscuro); }
        .btn-principal:disabled { background: #ccc; cursor: not-allowed; }
        .ticket-box { display: none; margin-top: 30px; background: #f9f9f9; border: 2px dashed var(--verde-medio); border-radius: 15px; padding: 20px; text-align: center; }
        .ticket-box h2 { color: var(--verde-medio); font-size: 1.2rem; margin-bottom: 10px; }
        .ticket-box .num { font-size: 2.5rem; font-weight: 900; color: var(--amarillo); margin: 10px 0; }
        .ticket-box p { font-size: 0.9rem; color: #555; margin-bottom: 5px; }
        .btn-copiar { background: #25D366; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }
        .instrucciones { margin-top: 20px; font-size: 0.85rem; color: #666; text-align: center; background: #fff8e1; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="master-container">
        <div class="master-header">
            <h1>🐙 Modo Máster</h1>
            <p>Registra clientes en el puesto de venta</p>
        </div>
        <div class="master-body">
            <div class="input-group">
                <input type="text" id="masterNombre" placeholder="Nombre del Cliente">
                <button class="btn-mic" onclick="dictar('masterNombre', this)">🎤</button>
            </div>
            <div class="input-group">
                <input type="tel" id="masterCelular" placeholder="Número de WhatsApp">
                <button class="btn-mic" onclick="dictar('masterCelular', this)">🎤</button>
            </div>
            <button class="btn-principal" id="btnRegistrar" onclick="registrarVenta()">Registrar Venta y Generar Ticket</button>
            <div class="ticket-box" id="resultadoTicket">
                <h2>¡Ticket Generado!</h2>
                <div class="num" id="resTicket">#1</div>
                <p><strong>Cliente:</strong> <span id="resNombre">...</span></p>
                <p><strong>Celular:</strong> <span id="resCelular">...</span></p>
                <p><strong>Fecha Sorteo:</strong> Sábado</p>
                <button class="btn-copiar" onclick="copiarTicket()">📋 Copiar Ticket para WhatsApp</button>
            </div>
            <div class="instrucciones">
                <strong>Instrucción:</strong> Registra al cliente, genera su ticket y usa el botón verde para copiar el texto y enviarlo por WhatsApp.
            </div>
        </div>
    </div>
    <script>
        function dictar(inputId, boton) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Tu navegador no soporta el dictado por voz."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; recognition.interimResults = false;
            boton.classList.add('escuchando'); boton.innerText = '🛑'; recognition.start();
            recognition.onresult = function(event) { document.getElementById(inputId).value = event.results[0][0].transcript; };
            recognition.onend = function() { boton.classList.remove('escuchando'); boton.innerText = '🎤'; };
            recognition.onerror = function() { boton.classList.remove('escuchando'); boton.innerText = '🎤'; };
        }

        let ticketActual = { nombre: '', celular: '', numero: 1 };

        async function registrarVenta() {
            const nombre = document.getElementById('masterNombre').value.trim();
            const celular = document.getElementById('masterCelular').value.trim();
            const btn = document.getElementById('btnRegistrar');

            if (nombre === '' || celular === '') { alert('Por favor, llena ambos campos.'); return; }

            btn.innerText = 'Guardando en MongoDB...';
            btn.disabled = true;

            try {
                const respuesta = await fetch('/api/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, celular: celular })
                });

                const resultado = await respuesta.json();

                if (resultado.ok) {
                    ticketActual.nombre = nombre;
                    ticketActual.celular = celular;
                    ticketActual.numero = Math.floor(1000 + Math.random() * 9000);

                    const hoy = new Date();
                    const diasParaSabado = (6 - hoy.getDay() + 7) % 7 || 7;
                    const proximoSabado = new Date(hoy);
                    proximoSabado.setDate(hoy.getDate() + diasParaSabado);
                    const fechaStr = proximoSabado.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });

                    document.getElementById('resTicket').innerText = '#' + ticketActual.numero;
                    document.getElementById('resNombre').innerText = ticketActual.nombre;
                    document.getElementById('resCelular').innerText = ticketActual.celular;
                    document.getElementById('resultadoTicket').style.display = 'block';

                    window.textoTicket = `🐙 *PLÁTANOS EL PULPO* 🐙\n\n` +
                                         `¡Hola ${ticketActual.nombre}!\n` +
                                         `Este es tu ticket para el sorteo semanal.\n\n` +
                                         `🎟️ *Ticket:* #${ticketActual.numero}\n` +
                                         `📱 *Celular:* ${ticketActual.celular}\n` +
                                         `📅 *Sorteo:* Sábado ${fechaStr}\n\n` +
                                         `¡Gracias por tu compra!`;
                    alert('¡Venta registrada y guardada en MongoDB!');
                } else {
                    alert('Error al guardar en MongoDB: ' + resultado.error);
                }
            } catch (error) {
                alert('Error de conexión: ' + error.message);
            } finally {
                btn.innerText = 'Registrar Venta y Generar Ticket';
                btn.disabled = false;
            }
        }

        function copiarTicket() {
            navigator.clipboard.writeText(window.textoTicket).then(() => {
                alert('¡Ticket copiado! Ahora pégalo en tu WhatsApp.');
            }).catch(() => {
                alert('No se pudo copiar automáticamente.');
            });
        }
    </script>
</body>
</html>
